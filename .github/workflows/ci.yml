name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: black --check src/ tests/
      - run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=src --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Check for PII in source (no raw PII patterns in log format strings)
        run: |
          if grep -rn -E 'logger\.(info|debug|warning|error).*%s.*(email|phone|name|address)' src/ --include="*.py" | grep -v '__'; then
            echo "FAIL: Potential PII in log format strings"
            exit 1
          fi
          echo "PASS: No PII patterns found in log statements"
      - name: Check for hardcoded secrets
        run: |
          if grep -rn 'password\s*=\s*["\x27]' src/ --include="*.py"; then
            echo "FAIL: Potential hardcoded password"
            exit 1
          fi
          echo "PASS: No hardcoded secrets found"
      - name: Run pip-audit (dependency vulnerability scan)
        run: pip-audit
