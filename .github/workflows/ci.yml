name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install mise (pinned)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          version: "2026.11.0"
      - name: Create venv on PATH
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: black --check src/ tests/
      - run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install mise (pinned)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          version: "2026.11.0"
      - name: Create venv on PATH
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: pytest --cov=src --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install mise (pinned)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2
        with:
          version: "2026.11.0"
      - name: Create venv on PATH
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - name: Check for PII in source (no raw PII patterns in log format strings)
        run: |
          if grep -rn -E 'logger\.(info|debug|warning|error).*%s.*(email|phone|name|address)' src/ --include="*.py" | grep -v '__'; then
            echo "FAIL: Potential PII in log format strings"
            exit 1
          fi
          echo "PASS: No PII patterns found in log statements"
      - name: Check for hardcoded secrets
        run: |
          if grep -rn 'password\s*=\s*["\x27]' src/ --include="*.py"; then
            echo "FAIL: Potential hardcoded password"
            exit 1
          fi
          echo "PASS: No hardcoded secrets found"
      - name: Run pip-audit (dependency vulnerability scan)
        run: pip-audit
