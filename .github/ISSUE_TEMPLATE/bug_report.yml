name: Bug Report
description: Report a bug in the JOL-Bitrix24 integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include PII** (names, emails, phone numbers) in this report.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration Version
    validations:
      required: true
  - type: dropdown
    id: entity
    attributes:
      label: Affected Entity
      options:
        - Contact
        - Deal
        - Company
        - Auth/Token
        - Webhook
        - Logging
        - Other
